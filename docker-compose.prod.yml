---
services:
  mysql:
    image: mysql:9.7
    container_name: babbel-mysql
    environment:
      MYSQL_RANDOM_ROOT_PASSWORD: "yes"
      MYSQL_DATABASE: ${BABBEL_DB_NAME:-babbel}
      MYSQL_USER: ${BABBEL_DB_USER:-babbel}
      MYSQL_PASSWORD: ${BABBEL_DB_PASSWORD:?Set BABBEL_DB_PASSWORD in .env}
      TZ: ${TZ}
    volumes:
      - mysql_data:/var/lib/mysql
      - ./migrations/001_complete_schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1"]
      interval: 30s
      timeout: 20s
      retries: 10
    restart: always
    # Docker rotates the log files. Docker keeps a maximum of 3 files of 10 MB.
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  babbel:
    image: ghcr.io/oszuidwest/zwfm-babbel:latest
    container_name: babbel-app
    # All settings come from .env. See .env.example.
    env_file: .env
    # The mysql service reads these through Compose, so a shell value must win here too.
    environment:
      - BABBEL_DB_USER
      - BABBEL_DB_PASSWORD
      - BABBEL_DB_NAME
    ports:
      - "8080:8080"
    volumes:
      - babbel_uploads:/app/uploads
      - babbel_audio:/app/audio
    depends_on:
      mysql:
        condition: service_healthy
    restart: always
    # Babbel writes the log data to stdout. Docker rotates the log files.
    # Docker keeps a maximum of 5 files of 50 MB.
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"

volumes:
  mysql_data:
  babbel_uploads:
  babbel_audio:
